containers:
  bcftools: "docker://quay.io/biocontainers/bcftools:1.19--h8b25389_0"
  vep: "docker://ensemblorg/ensembl-vep:release_113.0"
  r: "docker://ghcr.io/pseudocephalus/itmo-thesis-r:1.0"
input_vcf: "1000G.imputed.vcf.gz"
r2_threshold: 0.69
clusters: [1, 2, 3]
types: ["typed", "imputed"]
eur_samples_url: "http://dnascore.net/tutorial/1kg_eur.txt"
csq_terms:
  - splice_acceptor_variant
  - splice_donor_variant
  - stop_gained
  - frameshift_variant
  - stop_lost
  - start_lost
  - inframe_insertion
  - inframe_deletion
  - missense_variant
  - protein_altering_variant
  - synonymous_variant