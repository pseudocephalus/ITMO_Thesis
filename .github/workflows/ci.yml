name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Snakemake
        run: pip install snakemake==9.27.1

      - name: Create placeholder inputs
        run: |
          touch 1000G.imputed.vcf.gz
          mkdir -p controls_counts
          touch controls_counts/counts_{typed,imputed}_{1,2,3}.tsv

      - name: Dry run
        run: snakemake -n

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build R image
        run: docker build -t itmo-thesis-r:ci .